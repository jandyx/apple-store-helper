name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-22.04
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          APP="dist/Apple Store Helper.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" icon.iconset
          go build -ldflags "-s -w" -o "$APP/Contents/MacOS/apple-store-helper" .
          for s in 16 32 128 256 512; do
            sips -z $s $s Icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) Icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Apple Store Helper</string>
            <key>CFBundleDisplayName</key><string>Apple Store Helper</string>
            <key>CFBundleExecutable</key><string>apple-store-helper</string>
            <key>CFBundleIdentifier</key><string>apple.store.helper</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          cd dist && ditto -c -k --keepParent "Apple Store Helper.app" "../AppleStoreHelper-${{ matrix.name }}.zip"

      - name: Build Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -ldflags "-s -w -H windowsgui" -o "Apple Store Helper.exe" .
          7z a "AppleStoreHelper-${{ matrix.name }}.zip" "Apple Store Helper.exe"

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          go build -ldflags "-s -w" -o apple-store-helper .
          zip "AppleStoreHelper-${{ matrix.name }}.zip" apple-store-helper

      - uses: actions/upload-artifact@v4
        with:
          name: AppleStoreHelper-${{ matrix.name }}
          path: AppleStoreHelper-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: AppleStoreHelper-*.zip
